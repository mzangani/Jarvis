<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  /* ====== Base: buio profondo, ciano Stark ====== */
  :root {
    --ciano: #17e1ff;
    --ciano-scuro: #0aa8c4;
    --ambra: #ffb347;
    --rosso: #ff5a5a;
    --fondo: #030a12;
    --pannello: rgba(10, 30, 45, .55);
    --bordo: rgba(23, 225, 255, .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% 30%, rgba(23,225,255,.07), transparent 60%),
      radial-gradient(800px 500px at 80% 90%, rgba(23,225,255,.04), transparent 60%),
      var(--fondo);
    color: var(--ciano);
    font-family: "SF Mono", "Menlo", "Consolas", "DejaVu Sans Mono", monospace;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* scanline sottile su tutto */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.12) 2px 4px);
    mix-blend-mode: multiply;
  }

  /* ====== Testata ====== */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px; border-bottom: 1px solid var(--bordo);
    background: linear-gradient(180deg, rgba(23,225,255,.06), transparent);
  }
  .titolo { letter-spacing: .55em; font-size: 1.05rem; font-weight: 600;
            text-shadow: 0 0 12px rgba(23,225,255,.8); }
  .titolo small { letter-spacing: .2em; opacity: .5; font-size: .62rem; display: block; margin-top: 3px; }
  #stato {
    letter-spacing: .3em; font-size: .7rem; padding: 6px 14px;
    border: 1px solid var(--bordo); border-radius: 3px; text-transform: uppercase;
  }
  #stato.elaboro { color: var(--ambra); border-color: rgba(255,179,71,.5);
                   animation: lampeggia 1s steps(2) infinite; }
  #stato.errore  { color: var(--rosso); border-color: rgba(255,90,90,.5); }
  @keyframes lampeggia { 50% { opacity: .35; } }

  /* ====== Corpo: reattore + log ====== */
  main { flex: 1; display: flex; min-height: 0; }

  /* --- colonna reattore --- */
  #colonna-reattore {
    width: 320px; min-width: 260px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    border-right: 1px solid var(--bordo); position: relative;
  }
  /* angoli decorativi da HUD */
  .angolo { position: absolute; width: 22px; height: 22px; border-color: var(--ciano); opacity: .5; }
  .angolo.tl { top: 10px; left: 10px; border-top: 1px solid; border-left: 1px solid; }
  .angolo.tr { top: 10px; right: 10px; border-top: 1px solid; border-right: 1px solid; }
  .angolo.bl { bottom: 10px; left: 10px; border-bottom: 1px solid; border-left: 1px solid; }
  .angolo.br { bottom: 10px; right: 10px; border-bottom: 1px solid; border-right: 1px solid; }

  /* --- arc reactor --- */
  #reattore { position: relative; width: 210px; height: 210px; }
  #reattore .anello { position: absolute; inset: 0; border-radius: 50%; }
  #reattore .a1 { border: 1px solid rgba(23,225,255,.5);
                  box-shadow: 0 0 24px rgba(23,225,255,.35), inset 0 0 24px rgba(23,225,255,.2); }
  #reattore .a2 { inset: 16px; border: 1px dashed rgba(23,225,255,.55);
                  animation: ruota 14s linear infinite; }
  #reattore .a3 { inset: 34px; border: 2px solid transparent;
                  border-top-color: var(--ciano); border-bottom-color: var(--ciano);
                  animation: ruota 6s linear infinite reverse; opacity: .8; }
  #reattore .a4 { inset: 52px; border: 1px solid rgba(23,225,255,.4); }
  /* tacche radiali */
  #reattore .tacche { position: absolute; inset: 6px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(23,225,255,.5) 0deg 1.6deg, transparent 1.6deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%, #000 70%, transparent 71%);
            mask: radial-gradient(circle, transparent 62%, #000 63%, #000 70%, transparent 71%);
    animation: ruota 40s linear infinite; }
  #reattore .nucleo {
    position: absolute; inset: 70px; border-radius: 50%;
    background: radial-gradient(circle, #eaffff 0%, #9ff3ff 25%, var(--ciano) 55%, rgba(23,225,255,.15) 100%);
    box-shadow: 0 0 34px 8px rgba(23,225,255,.55), 0 0 90px 20px rgba(23,225,255,.25);
    animation: pulsa 2.6s ease-in-out infinite;
  }
  body.elaboro #reattore .a2 { animation-duration: 2.2s; }
  body.elaboro #reattore .a3 { animation-duration: 1.1s; }
  body.elaboro #reattore .nucleo { animation-duration: .8s; }
  @keyframes ruota { to { transform: rotate(360deg); } }
  @keyframes pulsa { 50% { transform: scale(.92); filter: brightness(1.25); } }

  #sotto-reattore { text-align: center; font-size: .62rem; letter-spacing: .35em;
                    opacity: .6; text-transform: uppercase; line-height: 2; }

  /* pulsanti voce */
  #controlli-voce { display: flex; gap: 12px; }
  .tondo {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--bordo);
    background: var(--pannello); color: var(--ciano); font-size: 1.1rem; cursor: pointer;
    display: grid; place-items: center; transition: box-shadow .2s, transform .1s;
  }
  .tondo:hover { box-shadow: 0 0 16px rgba(23,225,255,.5); }
  .tondo:active { transform: scale(.94); }
  .tondo.attivo { color: var(--ambra); border-color: rgba(255,179,71,.6);
                  box-shadow: 0 0 18px rgba(255,179,71,.45); }
  .tondo[disabled] { opacity: .25; cursor: not-allowed; }

  #sel-voce {
    max-width: 250px; background: var(--pannello); color: var(--ciano);
    border: 1px solid var(--bordo); border-radius: 3px; padding: 7px 10px;
    font-family: inherit; font-size: .66rem; letter-spacing: .05em; outline: none;
    cursor: pointer;
  }
  #sel-voce:focus { box-shadow: 0 0 12px rgba(23,225,255,.35); }
  #sel-voce option { background: #06131d; color: var(--ciano); }

  /* mentre PARLA, il reattore batte più veloce (ma meno che in elaborazione) */
  body.parlo #reattore .nucleo { animation-duration: 1.1s; }
  body.parlo #reattore .a3 { animation-duration: 2.6s; }

  /* --- colonna log --- */
  #colonna-log { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 22px 28px; scroll-behavior: smooth; }
  #log::-webkit-scrollbar { width: 5px; }
  #log::-webkit-scrollbar-thumb { background: rgba(23,225,255,.3); }

  .riga { margin-bottom: 14px; max-width: 900px; animation: entra .25s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
  .chi { font-size: .6rem; letter-spacing: .3em; opacity: .55; text-transform: uppercase;
         margin-bottom: 4px; }
  .testo { white-space: pre-wrap; line-height: 1.55; font-size: .88rem; }

  .riga.utente .chi { color: #d8f7ff; }
  .riga.utente .testo { color: #d8f7ff; }
  .riga.jarvis .testo { color: var(--ciano); text-shadow: 0 0 8px rgba(23,225,255,.35); }
  .riga.sistema { font-size: .72rem; opacity: .75; }
  .riga.sistema .testo { color: var(--ambra); }
  .riga.errore .testo { color: var(--rosso); }

  /* ====== conferma (pannello di allerta) ====== */
  #conferma {
    display: none; margin: 0 28px 14px; padding: 14px 18px;
    border: 1px solid rgba(255,179,71,.65); border-radius: 4px;
    background: rgba(60, 35, 0, .35); box-shadow: 0 0 24px rgba(255,179,71,.25);
    animation: entra .2s ease-out;
  }
  #conferma.visibile { display: block; }
  #conferma.dangerous { border-color: rgba(255,90,90,.7); background: rgba(60,0,0,.35);
                        box-shadow: 0 0 24px rgba(255,90,90,.3); }
  #conferma .intest { font-size: .62rem; letter-spacing: .35em; text-transform: uppercase;
                      color: var(--ambra); margin-bottom: 8px; animation: lampeggia 1.2s steps(2) infinite; }
  #conferma.dangerous .intest { color: var(--rosso); }
  #conferma pre { color: #ffe9c9; font-size: .8rem; white-space: pre-wrap; margin-bottom: 12px; }
  #conferma .bottoni { display: flex; gap: 12px; }
  #conferma button {
    flex: 1; padding: 9px 0; font-family: inherit; letter-spacing: .3em; font-size: .72rem;
    text-transform: uppercase; cursor: pointer; border-radius: 3px;
    background: transparent; transition: background .15s;
  }
  #btn-approva { border: 1px solid var(--ciano); color: var(--ciano); }
  #btn-approva:hover { background: rgba(23,225,255,.12); }
  #btn-nega { border: 1px solid var(--rosso); color: var(--rosso); }
  #btn-nega:hover { background: rgba(255,90,90,.12); }

  /* ====== barra input ====== */
  #barra {
    display: flex; gap: 12px; padding: 16px 28px 20px;
    border-top: 1px solid var(--bordo);
    background: linear-gradient(0deg, rgba(23,225,255,.05), transparent);
  }
  #ingresso {
    flex: 1; background: var(--pannello); border: 1px solid var(--bordo); border-radius: 4px;
    color: #d8f7ff; font-family: inherit; font-size: .92rem; padding: 12px 16px; outline: none;
  }
  #ingresso:focus { box-shadow: 0 0 16px rgba(23,225,255,.35); }
  #ingresso::placeholder { color: rgba(160, 220, 235, .35); letter-spacing: .12em; }
  #invia {
    padding: 0 26px; border: 1px solid var(--ciano); border-radius: 4px; background: transparent;
    color: var(--ciano); font-family: inherit; letter-spacing: .3em; font-size: .74rem;
    text-transform: uppercase; cursor: pointer; transition: background .15s;
  }
  #invia:hover { background: rgba(23,225,255,.12); }
  #invia[disabled] { opacity: .3; cursor: not-allowed; }

  @media (max-width: 760px) {
    #colonna-reattore { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="titolo">J.A.R.V.I.S.<small>Just A Rather Very Intelligent System</small></div>
  <div id="stato">in attesa</div>
</header>

<main>
  <section id="colonna-reattore">
    <div class="angolo tl"></div><div class="angolo tr"></div>
    <div class="angolo bl"></div><div class="angolo br"></div>
    <div id="reattore">
      <div class="anello a1"></div>
      <div class="tacche"></div>
      <div class="anello a2"></div>
      <div class="anello a3"></div>
      <div class="anello a4"></div>
      <div class="nucleo"></div>
    </div>
    <div id="sotto-reattore">Arc Reactor<br>online</div>
    <div id="controlli-voce">
      <button id="btn-mic" class="tondo" title="Parla (riconoscimento vocale del browser)">🎙</button>
      <button id="btn-tts" class="tondo" title="Attiva/disattiva la voce di Jarvis">🔊</button>
      <button id="btn-auto" class="tondo" title="Conversazione continua: dopo la risposta torno in ascolto">∞</button>
    </div>
    <select id="sel-voce" title="La voce di Jarvis (le migliori in alto)"></select>
  </section>

  <section id="colonna-log">
    <div id="log"></div>
    <div id="conferma">
      <div class="intest">⚠ richiesta di autorizzazione</div>
      <pre id="conferma-dettagli"></pre>
      <div class="bottoni">
        <button id="btn-approva">Approva</button>
        <button id="btn-nega">Nega</button>
      </div>
    </div>
    <div id="barra">
      <input id="ingresso" autocomplete="off" spellcheck="false"
             placeholder="Impartisci un ordine, signore…">
      <button id="invia">Invia</button>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const log = $("log"), stato = $("stato"), ingresso = $("ingresso"), invia = $("invia");
const conferma = $("conferma"), dettagli = $("conferma-dettagli");
const btnMic = $("btn-mic"), btnTts = $("btn-tts");

/* ---------- log ---------- */
function riga(classe, chi, testo) {
  const r = document.createElement("div");
  r.className = "riga " + classe;
  const c = document.createElement("div");
  c.className = "chi"; c.textContent = chi;
  const t = document.createElement("div");
  t.className = "testo"; t.textContent = testo;
  r.append(c, t); log.append(r);
  log.scrollTop = log.scrollHeight;
}

/* ---------- stato ---------- */
function setStato(valore) {
  document.body.classList.toggle("elaboro", valore === "elaboro");
  stato.className = valore === "elaboro" ? "elaboro" : "";
  stato.textContent = valore === "elaboro" ? "elaborazione…" : "in attesa";
  invia.disabled = valore === "elaboro";
}

/* ---------- sintesi vocale: la voce più UMANA disponibile ---------- */
const selVoce = $("sel-voce"), btnAuto = $("btn-auto");
let ttsAttivo = localStorage.getItem("jarvis_tts") === "1";
let autoAttivo = localStorage.getItem("jarvis_auto") === "1";
btnTts.classList.toggle("attivo", ttsAttivo);
btnAuto.classList.toggle("attivo", autoAttivo);

/* Tono calmo, da maggiordomo: appena sotto il pitch neutro, ritmo naturale. */
const RATE = 1.03, PITCH = 0.92;

/* Non tutte le voci sono uguali: le neurali/di sistema di qualità suonano UMANE,
   quelle base robotiche. Classifichiamo le italiane e proponiamo le migliori. */
function punteggioVoce(v) {
  if (!/^it[-_]/i.test(v.lang)) return -1;
  const n = v.name.toLowerCase();
  let p = 0;
  if (/premium/.test(n)) p += 50;
  if (/enhanced|migliorat/.test(n)) p += 40;
  if (/natural|neural/.test(n)) p += 35;
  if (/google/.test(n)) p += 30;   // "Google italiano" (Chrome): molto naturale
  if (/siri/.test(n)) p += 25;
  if (!v.localService) p += 5;     // le voci di rete sono spesso le più curate
  return p;
}

let voceScelta = null;
function caricaVoci() {
  const voci = speechSynthesis.getVoices()
    .filter(v => punteggioVoce(v) >= 0)
    .sort((a, b) => punteggioVoce(b) - punteggioVoce(a));
  selVoce.innerHTML = "";
  for (const v of voci) {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = v.name.replace(/\s*\(.*?\)\s*$/, m => m);
    selVoce.append(o);
  }
  const salvata = localStorage.getItem("jarvis_voce");
  voceScelta = voci.find(v => v.name === salvata) || voci[0] || null;
  if (voceScelta) selVoce.value = voceScelta.name;
  selVoce.style.display = voci.length ? "" : "none";
}
if ("speechSynthesis" in window) {
  caricaVoci();
  speechSynthesis.onvoiceschanged = caricaVoci;
} else {
  btnTts.disabled = true;
}

selVoce.onchange = () => {
  voceScelta = speechSynthesis.getVoices().find(v => v.name === selVoce.value) || null;
  localStorage.setItem("jarvis_voce", selVoce.value);
  if (ttsAttivo) parla("Questa è la mia voce, signore.");
};

btnTts.onclick = () => {
  ttsAttivo = !ttsAttivo;
  btnTts.classList.toggle("attivo", ttsAttivo);
  localStorage.setItem("jarvis_tts", ttsAttivo ? "1" : "0");
  if (!ttsAttivo) { speechSynthesis.cancel(); document.body.classList.remove("parlo"); }
  else parla("Sintesi vocale attiva, signore.");
};
btnAuto.onclick = () => {
  autoAttivo = !autoAttivo;
  btnAuto.classList.toggle("attivo", autoAttivo);
  localStorage.setItem("jarvis_auto", autoAttivo ? "1" : "0");
};

/* Il testo va spezzato in FRASI: le utterance brevi suonano più naturali (pause
   giuste) e alcuni browser TRONCANO quelle lunghe. Niente lookbehind (Safari). */
function inFrasi(testo) {
  const grezze = testo.replace(/\n+/g, ". ").match(/[^.!?…]+[.!?…]*/g) || [testo];
  const frasi = [];
  for (let f of grezze) {
    f = f.trim();
    while (f.length > 200) {              // spezza le frasi chilometriche sulle virgole
      let i = f.lastIndexOf(",", 200);
      if (i < 40) i = 200;
      frasi.push(f.slice(0, i + 1).trim());
      f = f.slice(i + 1).trim();
    }
    if (f) frasi.push(f);
  }
  return frasi;
}

/* parla(testo, poi): sintetizza frase per frase; `poi` (opzionale) è chiamata alla
   FINE del parlato — è il gancio della conversazione continua. */
function parla(testo, poi) {
  if (!ttsAttivo || !("speechSynthesis" in window) || !testo) { if (poi) poi(); return; }
  speechSynthesis.cancel();
  const frasi = inFrasi(testo);
  if (!frasi.length) { if (poi) poi(); return; }
  document.body.classList.add("parlo");
  frasi.forEach((frase, i) => {
    const u = new SpeechSynthesisUtterance(frase);
    u.lang = "it-IT"; u.rate = RATE; u.pitch = PITCH;
    if (voceScelta) u.voice = voceScelta;
    if (i === frasi.length - 1) {
      u.onend = u.onerror = () => {
        document.body.classList.remove("parlo");
        if (poi) poi();
      };
    }
    speechSynthesis.speak(u);
  });
}

/* ---------- riconoscimento vocale (facoltativo, dal browser) ---------- */
const Ricon = window.SpeechRecognition || window.webkitSpeechRecognition;
let ric = null;
if (Ricon) {
  ric = new Ricon();
  ric.lang = "it-IT"; ric.interimResults = false; ric.maxAlternatives = 1;
  ric.onresult = ev => {
    const testo = ev.results[0][0].transcript.trim();
    if (testo) { ingresso.value = testo; inviaTesto(); }
  };
  ric.onend = () => btnMic.classList.remove("attivo");
  ric.onerror = () => btnMic.classList.remove("attivo");
  btnMic.onclick = () => {
    if (btnMic.classList.contains("attivo")) { ric.stop(); return; }
    btnMic.classList.add("attivo");
    ric.start();
  };
} else {
  btnMic.disabled = true;
  btnMic.title = "Riconoscimento vocale non supportato da questo browser";
}

/* ---------- invio ---------- */
async function inviaTesto() {
  const testo = ingresso.value.trim();
  if (!testo) return;
  ingresso.value = "";
  riga("utente", "Comando", testo);
  const r = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ testo }),
  });
  if (r.status === 409) riga("sistema", "Sistema", "Sto ancora elaborando il comando precedente, signore.");
}
invia.onclick = inviaTesto;
ingresso.addEventListener("keydown", ev => { if (ev.key === "Enter") inviaTesto(); });

/* ---------- conferma ---------- */
function mostraConferma(ev) {
  dettagli.textContent =
    `tool:    ${ev.tool}\nrischio: ${ev.rischio}\n` +
    Object.entries(ev.input || {}).map(([k, v]) => `${k}: ${String(v)}`).join("\n");
  conferma.classList.toggle("dangerous", ev.rischio === "DANGEROUS");
  conferma.classList.add("visibile");
  parla("Richiesta di autorizzazione, signore.");
}
async function rispondi(ok) {
  conferma.classList.remove("visibile");
  await fetch("/api/conferma", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ok }),
  });
  riga("sistema", "Sistema", ok ? "Azione autorizzata." : "Azione negata.");
}
$("btn-approva").onclick = () => rispondi(true);
$("btn-nega").onclick = () => rispondi(false);

/* ---------- flusso eventi (SSE) ---------- */
const sse = new EventSource("/api/eventi");
sse.onmessage = msg => {
  const ev = JSON.parse(msg.data);
  switch (ev.tipo) {
    case "stato":     setStato(ev.valore); break;
    case "tool":      riga("sistema", "Sistema", `» uso ${ev.tool}(${JSON.stringify(ev.input)})`); break;
    case "nota":      riga("sistema", "Sistema", ev.testo); break;
    case "risposta":
      riga("jarvis", "J.A.R.V.I.S.", ev.testo);
      /* Alla voce va la versione RIPULITA dal server (niente simboli/markdown);
         a fine parlato, se la conversazione continua è attiva, riapriamo il microfono. */
      parla(ev.parlato || ev.testo, () => {
        if (autoAttivo && ric) {
          btnMic.classList.add("attivo");
          try { ric.start(); } catch (e) { /* già in ascolto: va bene così */ }
        }
      });
      break;
    case "errore":    riga("errore", "Errore", ev.testo); break;
    case "conferma_richiesta": mostraConferma(ev); break;
  }
};
sse.onerror = () => { /* il browser riprova da solo: nessun allarme */ };

riga("jarvis", "J.A.R.V.I.S.", "Sistemi online. A sua disposizione, signore.");
ingresso.focus();
</script>
</body>
</html>
